<rect x="24" y="460" width="16" height="16" rx="3" fill="#ef8d5f"/>
<text class="k" x="48" y="473">Coefficient cards, read in as instructions</text>
<rect x="24" y="484" width="16" height="16" rx="3" fill="#a9c9ef"/>
<text class="k" x="48" y="497">The row of nine ADDs, running on into 99</text>
